[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdpub"
version = "0.1.0"
description = "Polish Markdown files into blog-ready, publishable posts"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mahinoor", email = "mahin00r@users.noreply.github.com" }]
requires-python = ">=3.12"
dependencies = [
    "python-frontmatter>=1.1.0",
    "mdformat>=0.7.22",
    "pydantic>=2.0",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.40",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/mahin00r/mdpub"
Repository = "https://github.com/mahin00r/mdpub"
Issues = "https://github.com/mahin00r/mdpub/issues"
Profile = "https://github.com/mahin00r"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
mdpub = "mdpub.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mdpub = ["rules/*.yaml", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
