<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cat_images gallery</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 2rem 1.5rem 1rem;
      text-align: center;
    }
    header h1 { margin: 0 0 .25rem; font-size: 1.9rem; letter-spacing: .5px; }
    header p { margin: 0; color: var(--muted); }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
      padding: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    figure {
      margin: 0;
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0,0,0,.25);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    figure:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(0,0,0,.35); }
    figure img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      background: #000;
    }
    figcaption {
      padding: .6rem .75rem;
      font-size: .85rem;
      color: var(--muted);
      word-break: break-all;
    }
    footer { text-align: center; color: var(--muted); padding: 1.5rem; font-size: .85rem; }
  </style>
</head>
<body>
  <header>
    <h1>cat_images</h1>
    <p id="count">Loading gallery&hellip;</p>
  </header>
  <main id="gallery"></main>
  <footer>Served as a static site &mdash; development environment demo.</footer>

  <script>
    const images = [
      "3_vai_Bon.jpeg",
      "charlie.jpeg",
      "king.jpeg",
      "luna.jpeg",
      "max.jpeg",
      "poki.jpeg",
      "Hitler.jpeg"
    ];
    const gallery = document.getElementById("gallery");
    images.forEach((name) => {
      const fig = document.createElement("figure");
      const img = document.createElement("img");
      img.src = encodeURIComponent(name);
      img.alt = name;
      img.loading = "lazy";
      const cap = document.createElement("figcaption");
      cap.textContent = name;
      fig.appendChild(img);
      fig.appendChild(cap);
      gallery.appendChild(fig);
    });
    document.getElementById("count").textContent = images.length + " images";
  </script>
</body>
</html>
